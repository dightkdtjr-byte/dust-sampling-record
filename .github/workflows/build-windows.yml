name: Build Windows portable exe

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron 바이너리 캐시: 다운로드 서버가 느리거나 끊겨도(504) 빌드가 실패하지 않게
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies (retry on download failures)
        shell: pwsh
        run: |
          $ok = $false
          foreach ($i in 1..4) {
            npm ci
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "npm ci failed (attempt $i), retrying in $(20 * $i)s..."
            Start-Sleep -Seconds (20 * $i)
          }
          if (-not $ok) { exit 1 }

      - name: Build distribution exe (no company data)
        run: npm run electron:build

      - name: Build personal exe
        run: npm run electron:build:personal

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackPilot-Portable
          path: release/StackPilot.exe

      - name: Upload personal artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackPilot-Personal
          path: release-personal/StackPilot-Personal.exe

      # 브랜치에 푸시할 때마다 "latest-build" 프리릴리스의 배포용 exe를 갱신 (브라우저에서 바로 다운로드)
      # 개인용 exe는 회사 데이터가 들어 있으므로 공개 릴리스에는 올리지 않고 Actions 아티팩트(로그인 필요)로만 제공
      - name: Publish latest build (branch pushes)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 최신 빌드 (${{ github.ref_name }})
          prerelease: true
          body: |
            자동 빌드 커밋: ${{ github.sha }}
            - StackPilot.exe: 배포용 (회사 데이터 없음, 엑셀 추출 없음)
            - 개인용 StackPilot-Personal.exe 는 이 커밋의 Actions 실행 페이지 Artifacts 에서 받을 수 있습니다.
          files: release/StackPilot.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/StackPilot.exe
